version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=import
      - module=github.com/TeneficGames/podium
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - paths=import
      - module=github.com/TeneficGames/podium
  - local: protoc-gen-grpc-gateway
    out: .
    opt:
      - paths=import
      - module=github.com/TeneficGames/podium
  - local: protoc-gen-openapiv2
    out: ./docs/openapi
    strategy: all
    opt:
      - output_format=yaml
      - allow_merge=true
      - merge_file_name=spec
      - openapi_naming_strategy=simple
      - simple_operation_ids=true
