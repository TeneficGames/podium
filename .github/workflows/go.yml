---
name: Podium
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify modules and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Download and verify dependencies
        run: |
          make setup
          go mod verify
          (cd leaderboard && go mod verify)
          (cd client && go mod verify)
      - name: Build
        run: make build
      - name: Verify generated code
        run: |
          make proto-tools
          make proto
          git diff --exit-code

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Test
        run: make test-unit

  integration-tests:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      redis:
        image: redis:8-alpine
        options: '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5'
        ports:
          - '6379:6379'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Setup env
        run: make setup
      - name: Test
        run: make test
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_build/test-results/*.xml
          report_type: test_results
          use_oidc: true
      - name: Combine coverage
        if: ${{ !cancelled() }}
        run: make coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_build/test-coverage-all.out
          use_oidc: true
