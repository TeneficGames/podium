---
name: Podium
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify modules and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Download and verify dependencies
        run: |
          make setup
          go mod verify
          (cd leaderboard && go mod verify)
          (cd client && go mod verify)
      - name: Build
        run: make build
      - name: Verify generated code
        run: |
          make proto-tools
          make proto
          git diff --exit-code

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: Lint
        run: make lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Test
        run: make test-unit

  integration-tests:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      redis:
        image: redis:8-alpine
        options: '--health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5'
        ports:
          - '6379:6379'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            client/go.sum
      - name: Setup env
        run: make setup
      - name: Test
        run: make test
      - name: Combine coverage
        run: make coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_build/test-coverage-all.out
          use_oidc: true

  govulncheck:
    name: govulncheck (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            workdir: .
            go_mod: go.mod
            go_sum: go.sum
          - name: leaderboard
            workdir: leaderboard
            go_mod: leaderboard/go.mod
            go_sum: leaderboard/go.sum
          - name: client
            workdir: client
            go_mod: client/go.mod
            go_sum: client/go.sum
    steps:
      - uses: actions/checkout@v6
      - name: Scan
        uses: golang/govulncheck-action@v1
        with:
          cache-dependency-path: ${{ matrix.go_sum }}
          go-package: ./...
          go-version-file: ${{ matrix.go_mod }}
          repo-checkout: false
          work-dir: ${{ matrix.workdir }}
