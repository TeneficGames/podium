---
name: Release Helm chart

on:
  push:
    tags:
      - "podium-chart-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-chart-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish chart to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.1

      - name: Test chart
        run: make test-helm

      - name: Verify release tag
        id: version
        shell: bash
        run: |
          chart_version="$(helm show chart charts/podium | awk '$1 == "version:" { print $2 }')"
          expected_tag="podium-chart-v${chart_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${chart_version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tagged commit ${GITHUB_SHA} is not merged into main" >&2
            exit 1
          fi
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"

      - name: Package chart
        run: helm package charts/podium --destination dist

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}" |
          helm registry login ghcr.io
          --username "${{ github.actor }}"
          --password-stdin

      - name: Ensure version is unpublished
        run: |
          chart_ref="oci://ghcr.io/teneficgames/charts/podium"
          chart_version="${{ steps.version.outputs.chart_version }}"
          if helm show chart "${chart_ref}" --version "${chart_version}" >/dev/null 2>&1; then
            echo "chart version ${chart_version} is already published" >&2
            exit 1
          fi

      - name: Publish chart
        run: >-
          helm push
          "dist/podium-${{ steps.version.outputs.chart_version }}.tgz"
          oci://ghcr.io/teneficgames/charts
