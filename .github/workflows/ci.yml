---
name: CI
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: trungdlp/podium

jobs:
  verify:
    name: Verify modules and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            proto/go.sum
            client/go.sum
      - name: Download and verify dependencies
        run: |
          make setup
          go mod verify
          (cd leaderboard && go mod verify)
          (cd proto && go mod verify)
          (cd client && go mod verify)
      - name: Build
        run: make build
      - name: Verify Protobuf schemas and generated code
        run: |
          make proto-check
          make proto
          git diff --exit-code

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            proto/go.sum
            client/go.sum
      - name: Test
        run: make test-unit

  integration-podium:
    name: Integration tests (server)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        options: '--health-cmd "redis-cli ping" --health-interval 1s --health-timeout 3s --health-retries 10'
        ports:
          - '6379:6379'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            proto/go.sum
      - name: Test
        run: make test-podium
      - name: Save test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-podium
          path: |
            podium.coverprofile
            _build/test-results/podium.xml

  integration-leaderboard:
    name: Integration tests (leaderboard)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        options: '--health-cmd "redis-cli ping" --health-interval 1s --health-timeout 3s --health-retries 10'
        ports:
          - '6379:6379'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: leaderboard/go.mod
          cache-dependency-path: leaderboard/go.sum
      - name: Test
        run: make test-leaderboard
      - name: Save test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-leaderboard
          path: |
            leaderboard/leaderboard.coverprofile
            _build/test-results/leaderboard.xml

  integration-client:
    name: Integration tests (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache-dependency-path: |
            proto/go.sum
            client/go.sum
      - name: Test
        run: make test-client
      - name: Save test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-client
          path: |
            client/client.coverprofile
            _build/test-results/client.xml

  coverage:
    name: Integration coverage
    needs:
      - integration-podium
      - integration-leaderboard
      - integration-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Download server results
        uses: actions/download-artifact@v5
        with:
          name: integration-podium
          path: .
      - name: Download leaderboard results
        uses: actions/download-artifact@v5
        with:
          name: integration-leaderboard
          path: .
      - name: Download client results
        uses: actions/download-artifact@v5
        with:
          name: integration-client
          path: .
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_build/test-results/*.xml
          report_type: test_results
          use_oidc: true
      - name: Combine and check package coverage
        run: make coverage-check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./_build/test-coverage-all.out
          use_oidc: true

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            leaderboard/go.sum
            proto/go.sum
            client/go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: Lint
        run: make lint

  govulncheck:
    name: govulncheck (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            workdir: .
            go_sum: go.sum
          - name: leaderboard
            workdir: leaderboard
            go_sum: leaderboard/go.sum
          - name: proto
            workdir: proto
            go_sum: proto/go.sum
          - name: client
            workdir: client
            go_sum: client/go.sum
    steps:
      - uses: actions/checkout@v7
      - name: Scan
        uses: golang/govulncheck-action@v1
        with:
          cache-dependency-path: ${{ matrix.go_sum }}
          go-package: ./...
          go-version-input: 1.26.5
          repo-checkout: false
          work-dir: ${{ matrix.workdir }}

  client-compatibility:
    name: Client compatibility (Go 1.25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.12
          cache-dependency-path: |
            proto/go.sum
            client/go.sum
      - name: Test proto and client
        env:
          GOTOOLCHAIN: local
        run: |
          (cd proto && go test ./...)
          (cd client && go test ./...)

  docker:
    name: Build and publish image
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs:
      - verify
      - unit-tests
      - coverage
      - golangci-lint
      - govulncheck
      - client-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: trungdlp
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate image build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - unit-tests
      - coverage
      - golangci-lint
      - govulncheck
      - client-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate release metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: trungdlp
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
