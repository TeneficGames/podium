suite: Secrets
templates:
  - templates/secret.yaml
tests:
  - it: does not create a Secret without inline credentials
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a Secret for inline Redis credentials
    set:
      redis.password: redis-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.redis-password
          value: redis-secret

  - it: rejects incomplete inline basic authentication
    set:
      basicAuth.enabled: true
      basicAuth.username: admin
    asserts:
      - failedTemplate:
          errorMessage: basicAuth.username and basicAuth.password are required when basicAuth.enabled=true and no existingSecret is configured

  - it: creates a Secret for an inline enrichment cache credential
    set:
      config.enrichment.cache.password: cache-secret
    asserts:
      - equal:
          path: stringData.enrichment-cache-password
          value: cache-secret
