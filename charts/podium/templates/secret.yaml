{{- $redisSecret := and .Values.redis.password (not .Values.redis.existingSecret.name) -}}
{{- $basicAuthSecret := and .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret.name) -}}
{{- $enrichmentCacheSecret := and .Values.config.enrichment.cache.password (not .Values.config.enrichment.cache.existingSecret.name) -}}
{{- if and .Values.basicAuth.enabled (not .Values.basicAuth.existingSecret.name) (or (not .Values.basicAuth.username) (not .Values.basicAuth.password)) -}}
{{- fail "basicAuth.username and basicAuth.password are required when basicAuth.enabled=true and no existingSecret is configured" -}}
{{- end }}
{{- if or $redisSecret $basicAuthSecret $enrichmentCacheSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podium.fullname" . }}
  labels:
    {{- include "podium.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $redisSecret }}
  {{ .Values.redis.existingSecret.passwordKey }}: {{ .Values.redis.password | quote }}
  {{- end }}
  {{- if $basicAuthSecret }}
  {{ .Values.basicAuth.existingSecret.usernameKey }}: {{ .Values.basicAuth.username | quote }}
  {{ .Values.basicAuth.existingSecret.passwordKey }}: {{ .Values.basicAuth.password | quote }}
  {{- end }}
  {{- if $enrichmentCacheSecret }}
  {{ .Values.config.enrichment.cache.existingSecret.passwordKey }}: {{ .Values.config.enrichment.cache.password | quote }}
  {{- end }}
{{- end }}
