apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "podium.fullname" . }}-test-connection"
  labels:
    {{- include "podium.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - wget
      args:
        - --quiet
        - --output-document=-
        - http://{{ include "podium.fullname" . }}:{{ .Values.service.httpPort }}/healthcheck
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534

